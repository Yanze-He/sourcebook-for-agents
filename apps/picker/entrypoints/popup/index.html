<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picker for Agent</title>
    <!-- This is deliberately inline: it paints before the application bundle or
         local-service check starts, so the toolbar popup never appears blank. -->
    <style>
      html, body { background: #f7f6f1; color: #151513; margin: 0; min-width: 392px; width: 392px; }
      .popup { min-height: 126px; padding: 14px; }
      .popup-loading { align-items: center; display: flex; font: 680 12px/1.2 system-ui, sans-serif; gap: 9px; justify-content: center; min-height: 126px; color: #76746e; }
      .popup-loading-spinner { animation: picker-loading-spin 800ms linear infinite; border: 2px solid #dedcd5; border-radius: 999px; border-top-color: #1769ff; height: 16px; width: 16px; }
      @keyframes picker-loading-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="popup">
      <div id="settings-menu" class="settings-menu settings-menu--persistent">
        <button id="settings-toggle" class="icon-button" type="button" aria-label="设置" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <div id="settings-popover" class="settings-popover" role="menu" hidden>
          <button id="settings-help" role="menuitem" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.6 9a2.55 2.55 0 1 1 4.32 1.84c-1.15 1.12-1.92 1.63-1.92 3.16" /><path d="M12 17.1h.01" /></svg>
            <span>帮助</span>
          </button>
          <button id="settings-feedback" role="menuitem" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.48 8.8 8.8 0 0 1-3.4-.73L4 19.5l1.27-3.43A7.34 7.34 0 0 1 4 12a7.5 7.5 0 0 1 8-7.48A7.5 7.5 0 0 1 20 11.5Z" /><path d="M8.5 12h7M8.5 8.8h4.7" /></svg>
            <span>反馈</span>
          </button>
          <button id="settings-language" role="menuitem" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3.4 12h17.2M12 3a13.5 13.5 0 0 1 0 18M12 3a13.5 13.5 0 0 0 0 18" /></svg>
            <span>English</span>
          </button>
          <div class="settings-position" role="group" aria-labelledby="settings-position-label">
            <span id="settings-position-label" class="settings-position-label">浮层位置</span>
            <div class="settings-position-options">
              <button aria-label="右上" aria-pressed="true" data-picker-position="top-right" title="右上" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" /><circle cx="16.5" cy="7.5" r="2" fill="currentColor" stroke="none" /></svg></button>
              <button aria-label="右下" aria-pressed="false" data-picker-position="bottom-right" title="右下" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" /><circle cx="16.5" cy="16.5" r="2" fill="currentColor" stroke="none" /></svg></button>
              <button aria-label="左下" aria-pressed="false" data-picker-position="bottom-left" title="左下" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" /><circle cx="7.5" cy="16.5" r="2" fill="currentColor" stroke="none" /></svg></button>
              <button aria-label="左上" aria-pressed="false" data-picker-position="top-left" title="左上" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" /><circle cx="7.5" cy="7.5" r="2" fill="currentColor" stroke="none" /></svg></button>
            </div>
          </div>
        </div>
      </div>

      <section id="popup-loading" class="popup-loading" role="status" aria-live="polite">
        <span class="popup-loading-spinner" aria-hidden="true"></span>
        <span id="popup-loading-label">正在打开 Picker…</span>
      </section>

      <div id="picker-content" class="picker-content" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="sourcebook-mark"><img src="/sourcebook-mark.png" alt="" /></span>
          <div class="picker-wordmark">picker</div>
          <span id="connection-indicator" class="picker-connection-indicator">已连接 Desktop</span>
          <button id="connection-switch" class="connection-switch" type="button" aria-label="切换连接对象" title="切换连接对象"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"/><path d="m19 7-3 3M5 17l3-3"/></svg></button>
        </div>
        <div class="top-actions">
          <button id="picker-toggle" class="toggle-button" type="button" aria-pressed="false">
            <span id="picker-toggle-label">Off</span>
          </button>
        </div>
      </header>

      <div id="book-control" class="book-switcher" hidden>
        <p class="book-switcher-label">默认保存至：</p>
        <div class="book-switcher-control">
          <button id="book-toggle" class="book-switcher-button" type="button" aria-expanded="false" aria-haspopup="menu" aria-label="Current Book">
            <span id="book-name">Default Book</span>
            <svg class="book-switcher-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
          </button>
          <div id="book-menu" class="book-switcher-menu" role="menu" hidden></div>
        </div>
      </div>

      <section class="tools-panel" aria-label="Pick tools">
        <div class="action-grid">
          <div class="action-tool">
            <button id="select-chat-messages" class="action-card" type="button" aria-disabled="true" title="当前页未识别出聊天消息">
              <span class="button-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M20 11.5a7.5 7.5 0 0 1-8 7.48 8.8 8.8 0 0 1-3.4-.73L4 19.5l1.27-3.43A7.34 7.34 0 0 1 4 12a7.5 7.5 0 0 1 8-7.48A7.5 7.5 0 0 1 20 11.5Z" />
                  <path d="M8.5 12h7M8.5 8.8h4.7" />
                </svg>
              </span>
              <span class="button-label">Pick 对话</span>
            </button>
            <span id="chat-action-tooltip" class="action-tooltip" role="tooltip"></span>
          </div>
          <div class="action-tool">
            <button id="start-picking" class="action-card" type="button" aria-disabled="true" title="请先打开右上角 Picker 开关">
              <span class="button-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <circle cx="8.5" cy="8.5" r="1.5" />
                  <path d="m21 15-5-5L5 21" />
                </svg>
              </span>
              <span class="button-label">Pick 媒体</span>
            </button>
            <span id="media-action-tooltip" class="action-tooltip" role="tooltip"></span>
          </div>
          <div class="action-tool">
            <button id="pick-page" class="action-card" type="button" aria-disabled="true" title="保存当前网页">
              <span class="button-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M6 3.5h8.2L19 8.3V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V5a1.5 1.5 0 0 1 1.5-1.5Z" />
                  <path d="M14 3.8V8h4.2M8.5 12h7M8.5 16h5" />
                </svg>
              </span>
              <span class="button-label">Pick 网页</span>
            </button>
            <span id="page-action-tooltip" class="action-tooltip" role="tooltip"></span>
          </div>
        </div>
      </section>

      <section class="recent-panel" aria-label="Recent picks">
        <div class="panel-title">
          <strong>最近 Pick</strong>
          <small class="recent-more-hint">打开 Sourcebook 查看更多</small>
        </div>
        <div id="recent-picks" class="recent-list">
          <p>还没有最近内容。</p>
        </div>
      </section>

      <p id="status" class="picker-status" role="status">检查中</p>

      </div>

      <section id="connection-gate" class="connection-gate" aria-live="polite" hidden>
        <div class="connection-heading">
          <span class="connection-mark"><img src="/sourcebook-mark.png" alt="" /></span>
          <div><strong id="connection-title">请选择 Picker 的连接对象</strong><p id="connection-body">选择你正在使用的 Sourcebook。</p></div>
        </div>
        <div class="connection-targets">
          <section class="connection-target" data-connection-target="obsidian">
            <div class="connection-target-button"><span class="connection-target-icon is-obsidian" aria-hidden="true"><img src="https://obsidian.md/favicon.ico" alt="" loading="lazy" referrerpolicy="no-referrer" /></span><span><b>方式1: 连接 Obsidian</b><small>连接当前 Vault 中的 Sourcebook</small></span></div>
            <form id="connection-obsidian-form" class="connection-pair-form">
              <label><span>配对码</span><input id="connection-code" autocomplete="one-time-code" placeholder="请输入配对码…" /></label>
              <button id="connection-pair" class="connection-primary" type="submit">连接</button>
              <p id="connection-status" class="connection-status" role="status" aria-live="polite"></p>
            </form>
          </section>
          <section class="connection-target" data-connection-target="desktop">
            <div class="connection-target-button"><span class="connection-target-icon" aria-hidden="true"><img src="/sourcebook-mark.png" alt="" /></span><span><b>方式2: 连接 Desktop App</b><small>连接本机运行的 Sourcebook</small></span></div>
            <div class="connection-desktop-error">
              <div><button id="connection-download" class="connection-download" type="button">去下载</button><button id="connection-retry" class="connection-primary" type="button">连接</button></div>
              <p id="connection-desktop-status" class="connection-status" role="status" aria-live="polite" hidden>连接失败，请先启动本地应用。</p>
            </div>
          </section>
        </div>
      </section>

    </main>
  </body>
</html>
