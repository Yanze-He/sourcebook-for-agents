<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sourcebook product loop</title>
  <desc id="desc">A diagram showing web research flowing through Pick, Sources, and Pack.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f1eee7"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4285ff"/>
      <stop offset="1" stop-color="#165dde"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a1b1c" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect x="56" y="48" width="1488" height="110" rx="30" fill="#151515"/>
  <rect x="92" y="76" width="54" height="54" rx="14" fill="#fff"/>
  <path d="M106 92h12v7h8v8h-8v7h-12v-7h-8v-8h8z" fill="#151515"/>
  <text x="170" y="112" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">sourcebook</text>
  <text x="405" y="111" fill="#aaa" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FOR AGENTS</text>
  <text x="1506" y="112" fill="#bdbdbb" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">A local-first context workflow</text>

  <text x="800" y="245" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" text-anchor="middle">From the web to a usable context pack.</text>
  <text x="800" y="292" fill="#6d6c67" font-family="Arial, Helvetica, sans-serif" font-size="26" text-anchor="middle">Pick what matters. Keep the original source. Prepare only what the next agent needs.</text>

  <g filter="url(#shadow)">
    <rect x="86" y="366" width="416" height="404" rx="28" fill="#fff" stroke="#dfddd5" stroke-width="3"/>
    <rect x="86" y="366" width="416" height="68" rx="28" fill="#f1efe9"/>
    <circle cx="126" cy="400" r="9" fill="#ff6b5f"/>
    <circle cx="154" cy="400" r="9" fill="#f3b84b"/>
    <circle cx="182" cy="400" r="9" fill="#5fbe7a"/>
    <rect x="212" y="387" width="252" height="26" rx="13" fill="#fff"/>
    <text x="338" y="406" fill="#7b7972" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">design-reference.com</text>
    <rect x="118" y="466" width="352" height="166" rx="18" fill="#e1eaf8"/>
    <circle cx="198" cy="548" r="52" fill="#ff735c"/>
    <rect x="262" y="490" width="142" height="32" rx="16" fill="#fff" fill-opacity=".9"/>
    <rect x="262" y="538" width="164" height="18" rx="9" fill="#48546a" fill-opacity=".55"/>
    <rect x="262" y="570" width="120" height="18" rx="9" fill="#48546a" fill-opacity=".28"/>
    <rect x="104" y="454" width="380" height="190" rx="25" fill="none" stroke="#236af5" stroke-width="7" stroke-dasharray="20 14"/>
    <rect x="118" y="670" width="164" height="54" rx="18" fill="#171717"/>
    <text x="200" y="705" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle">Pick media</text>
    <text x="118" y="752" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">1. Pick</text>
    <text x="239" y="752" fill="#77756e" font-family="Arial, Helvetica, sans-serif" font-size="20">from the page you are on</text>
  </g>

  <path d="M543 570h78" stroke="#aaa69c" stroke-width="5" stroke-linecap="round"/>
  <path d="M609 552l24 18-24 18" fill="none" stroke="#aaa69c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="592" y="366" width="416" height="404" rx="28" fill="#fff" stroke="#dfddd5" stroke-width="3"/>
    <text x="628" y="424" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Sources</text>
    <text x="972" y="424" fill="#77756e" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="end">3 references</text>
    <rect x="628" y="456" width="344" height="80" rx="17" fill="#f5f4f0"/>
    <rect x="646" y="472" width="48" height="48" rx="12" fill="url(#blue)"/>
    <path d="M658 504l10-15 10 15 6-8 8 12h-34z" fill="#fff"/>
    <text x="714" y="488" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Visual system reference</text>
    <text x="714" y="514" fill="#77756e" font-family="Arial, Helvetica, sans-serif" font-size="16">Design Reference · picked today</text>
    <rect x="628" y="550" width="344" height="80" rx="17" fill="#f5f4f0"/>
    <rect x="646" y="566" width="48" height="48" rx="12" fill="#171717"/>
    <path d="M660 580h22v4h-22zm0 9h16v4h-16zm0 9h22v4h-22z" fill="#fff"/>
    <text x="714" y="582" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Agent workflow notes</text>
    <text x="714" y="608" fill="#77756e" font-family="Arial, Helvetica, sans-serif" font-size="16">Article · original URL retained</text>
    <rect x="628" y="644" width="344" height="80" rx="17" fill="#f5f4f0"/>
    <rect x="646" y="660" width="48" height="48" rx="12" fill="#efb247"/>
    <path d="M660 675h20v4h-20zm0 9h20v4h-20zm0 9h12v4h-12z" fill="#171717"/>
    <text x="714" y="676" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Conversation excerpt</text>
    <text x="714" y="702" fill="#77756e" font-family="Arial, Helvetica, sans-serif" font-size="16">Chat · selected messages only</text>
    <text x="628" y="752" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">2. Review</text>
    <text x="790" y="752" fill="#77756e" font-family="Arial, Helvetica, sans-serif" font-size="20">in a local library</text>
  </g>

  <path d="M1049 570h78" stroke="#aaa69c" stroke-width="5" stroke-linecap="round"/>
  <path d="M1115 552l24 18-24 18" fill="none" stroke="#aaa69c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="1098" y="366" width="416" height="404" rx="28" fill="#171717"/>
    <text x="1134" y="424" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Context pack</text>
    <rect x="1134" y="458" width="344" height="36" rx="10" fill="#333"/>
    <rect x="1134" y="514" width="284" height="12" rx="6" fill="#777"/>
    <rect x="1134" y="540" width="326" height="12" rx="6" fill="#555"/>
    <rect x="1134" y="566" width="242" height="12" rx="6" fill="#555"/>
    <rect x="1134" y="614" width="344" height="1" fill="#444"/>
    <text x="1134" y="660" fill="#bcbab3" font-family="Arial, Helvetica, sans-serif" font-size="18">References included</text>
    <text x="1478" y="660" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="end">3</text>
    <text x="1134" y="696" fill="#bcbab3" font-family="Arial, Helvetica, sans-serif" font-size="18">Original links retained</text>
    <text x="1478" y="696" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="end">Yes</text>
    <text x="1134" y="752" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">3. Pack</text>
    <text x="1261" y="752" fill="#aaa" font-family="Arial, Helvetica, sans-serif" font-size="20">for the next agent</text>
  </g>
</svg>
