name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_version:
        description: "Desktop version for this candidate, such as 0.1.1-beta.4"
        required: true
        type: string
      build_label:
        description: "Candidate build label, such as build.003"
        required: true
        type: string
      picker_changed:
        description: "Build a new Picker ZIP because Picker code, manifest, or permissions changed"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  extension:
    if: github.event_name == 'push' || inputs.picker_changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix apps/picker
      - run: npm --prefix apps/picker run build && npm --prefix apps/picker run zip
      - run: |
          mkdir -p release/extension
          picker_version=$(node -p "require('./apps/picker/package.json').version")
          picker_archive="sourcebook-picker-chromium-v${picker_version}.zip"
          find apps/picker/.output -name '*.zip' -exec cp {} "release/extension/${picker_archive}" \;
          shasum -a 256 "release/extension/${picker_archive}" > release/extension/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sourcebook-picker-chromium-v${{ github.event_name == 'workflow_dispatch' && inputs.build_label || github.ref_name }}
          path: release/extension/

  macos:
    runs-on: macos-14
    env:
      SOURCEBOOK_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.target_version || github.ref_type == 'tag' && github.ref_name || '' }}
      SOURCEBOOK_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.build_label || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
      - run: npm ci && npm ci --prefix apps/picker && npm ci --prefix apps/sources && npm ci --prefix apps/desktop
      - run: npm run build && npm --prefix apps/desktop run package:macos
      - run: shasum -a 256 "release/macos/sourcebook-desktop-installer-v${SOURCEBOOK_VERSION#v}.dmg" > release/macos/SHA256SUMS.txt
      - name: Prepare test candidate
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/prepare-candidate-artifact.mjs --platform macos --installer "release/macos/sourcebook-desktop-installer-v${SOURCEBOOK_VERSION#v}.dmg" --app "release/macos/Sourcebook Desktop.app"
      - uses: actions/upload-artifact@v4
        with:
          name: sourcebook-desktop-macos-${{ github.event_name == 'workflow_dispatch' && inputs.build_label || github.ref_name }}
          path: |
            release/macos/sourcebook-desktop-installer-v*.dmg
            release/macos/SHA256SUMS.txt
            release/macos/candidate/

  windows:
    runs-on: windows-latest
    env:
      SOURCEBOOK_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.target_version || github.ref_type == 'tag' && github.ref_name || '' }}
      SOURCEBOOK_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.build_label || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
      - run: npm ci
      - run: npm ci --prefix apps/picker
      - run: npm ci --prefix apps/sources
      - run: npm run build
      - run: npm --prefix apps/desktop run package:windows
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $env:SOURCEBOOK_WINDOWS_SOURCE = "${{ github.workspace }}\release\windows\Sourcebook Desktop"
          $env:SOURCEBOOK_WINDOWS_OUTPUT = "${{ github.workspace }}\release\windows\installer"
          if (-not $env:SOURCEBOOK_VERSION) { $env:SOURCEBOOK_VERSION = node -p "require('./package.json').version" }
          $env:SOURCEBOOK_VERSION = $env:SOURCEBOOK_VERSION.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" apps\desktop\installer\sourcebook.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write Windows checksum
        shell: pwsh
        run: |
          $installer = "release\windows\installer\sourcebook-desktop-installer-v$env:SOURCEBOOK_VERSION.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $installer)" | Set-Content -NoNewline "release\windows\installer\SHA256SUMS.txt"
      - name: Prepare test candidate
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: node scripts/prepare-candidate-artifact.mjs --platform windows --installer "release/windows/installer/sourcebook-desktop-installer-v$env:SOURCEBOOK_VERSION.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: sourcebook-desktop-windows-${{ github.event_name == 'workflow_dispatch' && inputs.build_label || github.ref_name }}
          path: |
            release/windows/installer/sourcebook-desktop-installer-v*.exe
            release/windows/installer/SHA256SUMS.txt
            release/windows/installer/candidate/
