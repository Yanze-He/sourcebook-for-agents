name: Main flow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/capture/package-lock.json
            apps/workspace/package-lock.json
      - run: npm ci && npm --prefix apps/capture ci && npm --prefix apps/workspace ci
      - run: npm --prefix apps/capture run typecheck
      - run: npm test
      - run: npm run build
