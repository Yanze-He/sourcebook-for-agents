name: Sourcebook checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/picker/package-lock.json
            apps/sources/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
      - run: npm ci && npm --prefix apps/picker ci && npm --prefix apps/sources ci
      - run: npm --prefix apps/picker run typecheck
      - run: go test ./...
        working-directory: apps/service-go
      - run: npm test
      - run: npm run build
