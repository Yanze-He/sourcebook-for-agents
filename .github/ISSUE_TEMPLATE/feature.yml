name: Feature request
description: Propose an improvement to Picker, Books & Library, Pack, or the Desktop App.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Picker, Books & Library, Pack, Desktop App, Documentation]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
