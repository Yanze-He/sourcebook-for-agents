name: Feature request
description: Propose an improvement to the public Pick, Sources, Pack, or Desktop loop.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Pick, Sources, Pack, Desktop, Documentation]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
